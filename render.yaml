services:
  - type: web
    name: new-api-mcp
    env: python
    plan: free

    buildCommand: >
      apt-get update -q &&
      apt-get install -y openjdk-21-jdk &&
      pip install -r requirements.txt &&
      PLAYWRIGHT_BROWSERS_PATH=/opt/render/project/src/.playwright playwright install chromium &&
      PLAYWRIGHT_BROWSERS_PATH=/opt/render/project/src/.playwright playwright install-deps chromium

    startCommand: >
      export JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64 &&
      export PATH=$JAVA_HOME/bin:$PATH &&
      uvicorn asgi:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: JAVA_HOME
        value: /usr/lib/jvm/java-21-openjdk-amd64
      - key: PATH
        value: /usr/lib/jvm/java-21-openjdk-amd64/bin:$PATH