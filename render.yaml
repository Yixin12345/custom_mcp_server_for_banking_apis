services:
    - type: web
      name: new-api-mcp
      env: python
      plan: free
      buildCommand: >-
        pip install -r requirements.txt &&
        PLAYWRIGHT_BROWSERS_PATH=/opt/render/project/src/.playwright playwright install chromium &&
        PLAYWRIGHT_BROWSERS_PATH=/opt/render/project/src/.playwright playwright install-deps chromium &&
        apt-get install -y --no-install-recommends openjdk-17-jdk-headless &&
        java -version
      startCommand: uvicorn asgi:app --host 0.0.0.0 --port $PORT
      healthCheckPath: /health
      envVars:
        - key: PLAYWRIGHT_BROWSERS_PATH
          value: /opt/render/project/src/.playwright
        - key: MCP_TRANSPORT
          value: streamable-http
        - key: MCP_DISABLE_DNS_REBINDING_PROTECTION
          value: "true"
