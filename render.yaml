services:
  - type: web
    name: new-api-mcp
    env: python
    plan: free
    buildCommand: >-
      apt-get update -q &&
      apt-get install -y openjdk-21-jdk &&
      pip install -r requirements.txt &&
      PLAYWRIGHT_BROWSERS_PATH=/opt/render/project/src/.playwright playwright install chromium &&
      PLAYWRIGHT_BROWSERS_PATH=/opt/render/project/src/.playwright playwright install-deps chromium &&
      java -version
    startCommand: export JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64 && uvicorn asgi:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: JAVA_HOME
        value: /usr/lib/jvm/java-21-openjdk-amd64
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: /opt/render/project/src/.playwright
      - key: MCP_TRANSPORT
        value: streamable-http
      - key: MCP_DISABLE_DNS_REBINDING_PROTECTION
        value: "true"